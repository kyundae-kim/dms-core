[project]
name = "dms-core"
version = "0.10.0"
description = "A Python package for DocMesh, a document management system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "minio>=7.2.20",
    "miniopy-async>=1.23.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.setuptools.packages.find]
include = ["dms*"]
exclude = ["test_dms*"]

[tool.pytest.ini_options]
testpaths = ["test_dms"]
addopts = ["-ra"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["integration: mark test as integration test (requires external services)"]
asyncio_mode = "auto"

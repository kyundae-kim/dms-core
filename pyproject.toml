[project]
name = "dms"
version = "0.6.0"
description = "A Python package for DocMesh, a document management system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "minio>=7.2.20",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["dms*"]
exclude = ["test_dms*"]

[tool.pytest.ini_options]
testpaths = ["test_dms"]
addopts = ["-ra"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["integration: mark test as integration test (requires external services)"]
anyio_mode = "auto"
